name: build-and-push

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 1 * *'   # monthly — 1st of month, 06:00 UTC (refreshes 8.5 from upstream)
  workflow_dispatch: {}

jobs:
  build-8.5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
      - uses: docker/setup-buildx-action@v3
      - run: |
          image="kurmisrainas/php:8.5"
          docker buildx build --file Dockerfiles/8.5/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t "$image" -t "$image:${{ github.run_id }}" --push .

  build-7.4:
    # Skip on the monthly schedule — 7.4 has no upstream to refresh
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
      - uses: docker/setup-buildx-action@v3
      - run: |
          image="kurmisrainas/php:7.4"
          docker buildx build --file Dockerfiles/7.4/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t "$image" -t "$image:${{ github.run_id }}-cve-patched" --push .
