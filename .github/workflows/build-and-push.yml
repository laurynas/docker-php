name: build-and-push

on:
  push:
    branches:
      - 7.4-apache-cve-2026

jobs:
  docker_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-latest
            arch: arm64
    steps:
      - name: Branch name
        run: echo running on branch ${GITHUB_REF##*/}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build --pull -t kurmisrainas/php:7.4.33-apache-cve-2026-${{matrix.arch}} .
          docker push kurmisrainas/php:7.4.33-apache-cve-2026-${{matrix.arch}}

  docker_manifest:
    needs: docker_build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create kurmisrainas/php:7.4.33-apache-cve-2026 kurmisrainas/php:7.4.33-apache-cve-2026-amd64 kurmisrainas/php:7.4.33-apache-cve-2026-arm64
          docker manifest push kurmisrainas/php:7.4.33-apache-cve-2026
