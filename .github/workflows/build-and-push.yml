name: build-and-push

on:
  push:
    branches:
      - 8.4-apache

jobs:
  docker_build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-latest
            arch: arm64
    steps:
      - name: Branch name
        run: echo running on branch ${GITHUB_REF##*/}

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t kurmisrainas/php:8.4-apache-${{matrix.arch}} .
          docker push kurmisrainas/php:8.4-apache-${{matrix.arch}}

  docker_manifest:
    needs: docker_build
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest
        run: |
          docker manifest create kurmisrainas/php:8.4-apache kurmisrainas/php:8.4-apache-amd64 kurmisrainas/php:8.4-apache-arm64
          docker manifest push kurmisrainas/php:8.4-apache
