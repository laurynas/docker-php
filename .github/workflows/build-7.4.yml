name: build-and-push-7.4

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-php-74:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          registry: docker.io
      - uses: docker/setup-buildx-action@v4
      - run: |
          repo="kurmisrainas/php"
          version=7.4
          date=$(date -u +%Y%m%d)
          snapshot="${version}-${date}-${{ github.run_id }}-cve-patched"
          docker buildx build --file Dockerfiles/7.4/Dockerfile \
            --platform linux/amd64,linux/arm64 \
            -t "${repo}:${version}" \
            -t "${repo}:${snapshot}" \
            --push .
